name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend suite
        run: python -m pytest
      - name: Check dependency consistency
        run: python -m pip check
      - name: Scan tracked files for secrets
        run: python scripts/check_no_secrets.py

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run contract checks
        run: |
          node tests/transcriptRange.test.mjs
          node tests/voiceCapture.test.mjs
          node tests/patientCheckIn.test.mjs
      - name: Build production frontend
        run: npm run build
      - name: Check dependency tree
        run: npm ls --depth=0

  technical-brief:
    name: Technical Brief generator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install document dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Regenerate DOCX and PDF
        run: python scripts/generate_technical_brief.py
      - name: Verify generated deliverables exist
        shell: bash
        run: test -s output/docx/Nightingale_Technical_Brief.docx && test -s output/pdf/Nightingale_Technical_Brief.pdf
